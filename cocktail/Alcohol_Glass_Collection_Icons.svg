		<text transform="translate(1519.55 68.59)">
<tspan x="0" y="0">Beer: pint, nonic, stange, pilsner,</tspan>
<tspan x="0" y="50">pilsner flute, pilsner footed, weizen,</tspan>
<tspan x="0" y="100">stein, ipa, snifter, tulip, goblet</tspan></text>
		<text transform="translate(1519.55 321.26)">
<tspan x="0" y="0">Cocktail: cocktail, coupe, coupe large,</tspan>
<tspan x="0" y="50">margarita, hurricane, poco grande,</tspan>
<tspan x="0" y="100">zombie, nick and nora, grappa</tspan></text>
		<text transform="translate(1519.55 600.07)">
<tspan x="0" y="0">rocks, old fashioned/low ball,</tspan>
<tspan x="0" y="50">high ball, collins, irish coffee, snifter,</tspan>
<tspan x="0" y="100">glencairn, julep, copper mug</tspan></text>
		<text transform="translate(1519.55 924.87)">
<tspan x="0" y="0">Wine: red, white, flute, sauternes,</tspan>
<tspan x="0" y="60">sherry, port, madeira, stemless</tspan></text>
		<text transform="translate(84.95 1418.78)">shot single double pitcher iced tea</text>
	</g>
